name: Build Tareeq AlJannah APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK & NDK
        run: |
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Setup Flutter 3.27.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Create Flutter Project & Sync Files
        run: |
          flutter create --org com.tareeq.aljannah --project-name tareeq_aljannah app_project
          rm -rf app_project/test
          cp -f "$GITHUB_WORKSPACE/pubspec.yaml" app_project/pubspec.yaml
          cp -rf "$GITHUB_WORKSPACE/lib/"* app_project/lib/
          if [ -f "$GITHUB_WORKSPACE/app_icon_jannah.png" ]; then
            cp -f "$GITHUB_WORKSPACE/app_icon_jannah.png" app_project/app_icon_jannah.png
          fi
          cd app_project
          flutter pub get

          if [ -f "app_icon_jannah.png" ]; then
            dart run flutter_launcher_icons
          fi

          python3 - << 'PYEOF'
          import json, os
          pkg_cfg = ".dart_tool/package_config.json"
          if os.path.exists(pkg_cfg):
              with open(pkg_cfg, "r") as f:
                  data = json.load(f)
              data["packages"] = [p for p in data.get("packages", []) if p.get("name") != "record_linux"]
              with open(pkg_cfg, "w") as f:
                  json.dump(data, f, indent=2)
          PYEOF
          sed -i '/record_linux/d' .flutter-plugins-dependencies 2>/dev/null || true

      - name: Configure AndroidManifest & Gradle
        run: |
          cd "$GITHUB_WORKSPACE/app_project"

          if [ -f "$GITHUB_WORKSPACE/splash_jannah.png" ]; then
            mkdir -p android/app/src/main/res/drawable
            pip install -q Pillow
            python3 -c "from PIL import Image; Image.open('$GITHUB_WORKSPACE/splash_jannah.png').convert('RGBA').save('android/app/src/main/res/drawable/splash_bg.png', 'PNG')"
            cat << 'EOF' > android/app/src/main/res/drawable/launch_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <bitmap android:gravity="fill" android:src="@drawable/splash_bg" />
              </item>
          </layer-list>
          EOF
          fi

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:label="طريق الجنة"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          for f in android/settings.gradle android/settings.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/id "com.android.application" version ".*"/id "com.android.application" version "8.9.1"/g' "$f"
              sed -i 's/id("com.android.application") version ".*"/id("com.android.application") version "8.9.1"/g' "$f"
              sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "2.1.0"/g' "$f"
              sed -i 's/id("org.jetbrains.kotlin.android") version ".*"/id("org.jetbrains.kotlin.android") version "2.1.0"/g' "$f"
            fi
          done

          sed -i 's/gradle-.*-all.zip/gradle-8.11.1-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties

          rm -f android/app/build.gradle.kts
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.tareeq.aljannah.tareeq_aljannah"
              compileSdk 36
              ndkVersion "27.0.12077973"

              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              sourceSets {
                  main.java.srcDirs += 'src/main/kotlin'
              }

              defaultConfig {
                  applicationId "com.tareeq.aljannah.tareeq_aljannah"
                  minSdkVersion 24
                  targetSdkVersion 36
                  versionCode 2
                  versionName "2.0.0"
                  multiDexEnabled true
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
          }

          flutter {
              source '../..'
          }
          EOF

      - name: Build Release APK
        run: |
          cd "$GITHUB_WORKSPACE/app_project"
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: tareeq-aljannah-v2
          path: app_project/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 2
