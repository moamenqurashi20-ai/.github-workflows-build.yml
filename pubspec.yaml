name: tareeq_aljannah
description: تطبيق طريق الجنة الإسلامي الشامل.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '^3.6.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  adhan: ^2.0.0+1
  geolocator: ^13.0.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  http: ^1.2.2
  audioplayers: ^6.1.0
  record: ^6.0.0
  file_picker: ^8.1.4
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  flutter_compass: ^0.8.0
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "app_icon_jannah.png"
  adaptive_icon_background: "#0A2E24"
  adaptive_icon_foreground: "app_icon_jannah.png"

flutter:
  uses-material-design: true
